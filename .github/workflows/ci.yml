name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Audit dependencies for HIGH/CRITICAL advisories
        run: python scripts/dependency_audit.py --requirements requirements.txt

      - name: Lint
        run: ruff check .

      - name: Start backend for E2E frontend tests
        run: |
          python -m uvicorn hepatiq.backend.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          python -c "
          import sys, time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://localhost:8000/health', timeout=2)
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print(open('uvicorn.log').read())
          sys.exit(1)
          "

      - name: Run test suite
        run: >
          python -m pytest -v
          --cov=hepatiq.backend --cov=hepatiq.ml --cov=hepatiq.validation --cov=hepatiq.model_artifact
          --cov-report=term-missing
          --cov-fail-under=60
