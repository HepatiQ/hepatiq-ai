name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Start backend for E2E frontend tests
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          python -c "
          import sys, time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://localhost:8000/health', timeout=2)
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print(open('uvicorn.log').read())
          sys.exit(1)
          "

      - name: Run test suite
        run: >
          python -m pytest -v
          --cov=backend --cov=ml --cov=validation
          --cov-report=term-missing
          --cov-fail-under=55
